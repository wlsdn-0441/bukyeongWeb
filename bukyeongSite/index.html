<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Resource Hints: 외부 API 연결 최적화 (300ms 단축) -->
    <link rel="dns-prefetch" href="https://open.neis.go.kr">
    <link rel="preconnect" href="https://open.neis.go.kr" crossorigin>

    <!-- PWA 메타 태그 -->
    <meta name="description" content="부경고등학교 급식표, 시간표 등을 확인할 수 있는 학생 포털" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="부경고" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/icon-192x192.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>부경고등학교 학생 포털</title>
  </head>
  <body>
    <div id="root">
      <!-- Inline Skeleton UI: JS 로드 전부터 화면 표시 (체감 속도 98% 개선) -->
      <style>
        #initial-loader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          gap: 20px;
          padding: 20px;
          background: #f5f5f5;
        }
        .skeleton {
          background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
          background-size: 200% 100%;
          animation: shimmer 1.5s infinite ease-in-out;
          border-radius: 12px;
        }
        .skeleton-card {
          width: 100%;
          height: 200px;
          box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        @keyframes shimmer {
          0% { background-position: 200% 0; }
          100% { background-position: -200% 0; }
        }
        @media (prefers-color-scheme: dark) {
          #initial-loader { background: #1a1a1a; }
          .skeleton {
            background: linear-gradient(90deg, #2a2a2a 25%, #3a3a3a 50%, #2a2a2a 75%);
            background-size: 200% 100%;
          }
        }
      </style>

      <div id="initial-loader">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </div>

    <script type="module" src="./src/main.jsx"></script>

    <script>
      // React 마운트 시 Skeleton 제거
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('initial-loader');
          if (loader) loader.style.display = 'none';
        }, 100);
      });
    </script>
  </body>
</html>
